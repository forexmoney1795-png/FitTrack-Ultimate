name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project Zip & Find Directory
        run: |
          unzip -o *.zip -d extracted_project
          GRADLE_FILE=$(find extracted_project -name "build.gradle" | head -n 1)
          PROJ_PATH=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJ_PATH" >> $GITHUB_ENV

      - name: Change App Name
        run: |
          # Replace app_name in strings.xml and AndroidManifest.xml
          find ${{ env.PROJECT_DIR }} -name "strings.xml" -exec sed -i 's/>FitTrack Ultimate</>FitTrack</g' {} + || true
          find ${{ env.PROJECT_DIR }} -name "strings.xml" -exec sed -i 's/name="app_name">.*/name="app_name">FitTrack<\/string>/g' {} + || true
          find ${{ env.PROJECT_DIR }} -name "AndroidManifest.xml" -exec sed -i 's/android:label="FitTrack Ultimate"/android:label="FitTrack"/g' {} + || true

      - name: Create Custom Logo Image
        run: |
          python3 -c "
          import base64
          # Sample PNG Logo Icon
          img_data = ''
          with open('custom_icon.png', 'wb') as f:
              f.write(base64.b64decode(img_data))
          "

      - name: Replace App Logo Icons
        run: |
          # Replace all mipmap & drawable app icons with custom_icon.png
          find ${{ env.PROJECT_DIR }} -name "ic_launcher*.png" -exec cp custom_icon.png {} + || true
          find ${{ env.PROJECT_DIR }} -name "ic_launcher*.webp" -exec cp custom_icon.png {} + || true

      - name: Make gradlew executable & Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "gradlew" ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi
          find . -name "*.apk" -exec mv {} ./FitTrack.apk \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack
          path: '${{ env.PROJECT_DIR }}/FitTrack.apk'
