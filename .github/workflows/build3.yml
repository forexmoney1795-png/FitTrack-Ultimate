name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project Zip & Find Directory
        run: |
          unzip -o *.zip -d extracted_project
          GRADLE_FILE=$(find extracted_project -name "build.gradle" | head -n 1)
          PROJ_PATH=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJ_PATH" >> $GITHUB_ENV

      - name: Force Update App Name and Developer Info
        run: |
          python3 -c "
          import os

          project_dir = '${{ env.PROJECT_DIR }}'
          print(f'Scanning project directory: {project_dir}')

          # Walk through all files in the project directory
          for root, dirs, files in os.walk(project_dir):
              for file in files:
                  # Check strings.xml and AndroidManifest.xml
                  if file == 'strings.xml' or file == 'AndroidManifest.xml':
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          modified = False
                          
                          # Replace any variation of the old name
                          if 'FitTrack Ultimate' in content:
                              content = content.replace('FitTrack Ultimate', 'FitTrack')
                              modified = True
                          
                          if 'android:label=\"FitTrack Ultimate\"' in content:
                              content = content.replace('android:label=\"FitTrack Ultimate\"', 'android:label=\"FitTrack\"')
                              modified = True

                          # Inject Developer info into strings.xml
                          if file == 'strings.xml' and 'Princefittrack@gmail.com' not in content:
                              if '</resources>' in content:
                                  dev_info = '    <string name=\"developer_info\">Developer: Prince</string>\n    <string name=\"contact_info\">Contact: Princefittrack@gmail.com</string>\n'
                                  content = content.replace('</resources>', dev_info + '</resources>')
                                  modified = True

                          if modified:
                              with open(file_path, 'w', encoding='utf-8') as f:
                                  f.write(content)
                              print(f'Successfully updated: {file_path}')
                      except Exception as e:
                          print(f'Error processing {file_path}: {e}')
          "

      - name: Make gradlew executable & Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "gradlew" ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi
          find . -name "*.apk" -exec mv {} ./FitTrack.apk \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack
          path: '${{ env.PROJECT_DIR }}/FitTrack.apk'
