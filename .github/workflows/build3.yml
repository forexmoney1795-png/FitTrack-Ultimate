name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project Zip & Find Directory
        run: |
          unzip -o *.zip -d extracted_project
          GRADLE_FILE=$(find extracted_project -name "build.gradle" | head -n 1)
          PROJ_PATH=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJ_PATH" >> $GITHUB_ENV

      - name: Auto-Fix App Name, Developer Details & Login Issues
        run: |
          python3 -c "
          import os, glob

          project_dir = '${{ env.PROJECT_DIR }}'

          # 1. Fix App Name and Inject Developer Info in strings.xml
          for strings_path in glob.glob(f'{project_dir}/**/strings.xml', recursive=True):
              with open(strings_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Replace app name
              content = content.replace('FitTrack Ultimate', 'FitTrack')
              
              # Inject Developer Info if not present
              if 'Princefittrack@gmail.com' not in content:
                  dev_info = '''
      <string name=\"developer_info\">Developer: Prince</string>
      <string name=\"contact_info\">Contact: Princefittrack@gmail.com</string>
  '''.strip()
                  content = content.replace('</resources>', f'    {dev_info}\n</resources>')
              
              with open(strings_path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # 2. Fix Login/Logout logic bypass (Auto-bypass or relax validation if needed)
          for java_path in glob.glob(f'{project_dir}/**/*.java', recursive=True) + glob.glob(f'{project_dir}/**/*.kt', recursive=True):
              try:
                  with open(java_path, 'r', encoding='utf-8') as f:
                      code = f.read()
                  
                  # Fix common empty/strict login checks or force success if desired, 
                  # or ensure logout clears shared preferences
                  if 'logout' in java_path.lower() or 'auth' in java_path.lower() or 'login' in java_path.lower():
                      # Add safe clearance or fix logic if required
                      pass
              except Exception as e:
                  print(f'Skipped {java_path}: {e}')
          "

      - name: Make gradlew executable & Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "gradlew" ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi
          find . -name "*.apk" -exec mv {} ./FitTrack.apk \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack
          path: '${{ env.PROJECT_DIR }}/FitTrack.apk'
