name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project Zip & Find Directory
        run: |
          unzip -o *.zip -d extracted_project
          GRADLE_FILE=$(find extracted_project -name "build.gradle" | head -n 1)
          PROJ_PATH=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJ_PATH" >> $GITHUB_ENV

      - name: Modify App Name
        run: |
          find ${{ env.PROJECT_DIR }} -name "strings.xml" -exec sed -i 's/FitTrack Ultimate/FitTrack/g' {} + || true

      - name: Create Dummy Logo Image
        run: |
          # Download a clean minimal icon or use python to generate a valid 1x1 png icon safely
          python3 -c "import base64; open('custom_icon.png', 'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))"

      - name: Replace App Logo
        run: |
          find ${{ env.PROJECT_DIR }} -name "ic_launcher*.png" -exec cp custom_icon.png {} + || true

      - name: Make gradlew executable & Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "gradlew" ]; then chmod +x gradlew; ./gradlew assembleDebug; else gradle assembleDebug; fi
          find . -name "*.apk" -exec mv {} ./FitTrack.apk \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack
          path: '${{ env.PROJECT_DIR }}/FitTrack.apk'
