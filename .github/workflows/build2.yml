name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project Zip
        run: |
          unzip -o *.zip -d extracted_project
          PROJ_PATH=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJ_PATH" >> $GITHUB_ENV

      - name: Change App Name Automatically
        run: |
          STRINGS_PATH=$(find ${{ env.PROJECT_DIR }} -name "strings.xml" | head -n 1)
          sed -i 's/FitTrack Ultimate/FitTrack/g' $STRINGS_PATH

      - name: Create Base64 Logo Image
        run: |
          cat << 'EOF' > logo_base64.txt
          iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAAARnQU1BAACx
          jwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAGKSURBVHgB7dpRCsIwEABRh2p/9SBe19C9
          b1f3vtA22L3RzYIQ14S0v3wMBDImA7O404mIuInXde39fn9e/+/3ezmO47Suazkej+P5fEa9332s
          c3/f92y/E3sNfUj3C/m/AFAAMACmByC6L93xJ1I8IcoTggKAAUABwACYHoDovnTHn0jxhChPCAoA
          BgAFAMMAoP2O/E3sNfQh3S/MvwSgAFAAMACmByC6L93xJ1I8IcoTggKAAUABwACYHoDovnTHn0jx
          hChPCAoA/3cAv/s/Ifo1B4D2O/I3sNfQh3S/MP8SgAFAAMACmByC6L93xJ1I8IcoTggKAAUABwAD
          YHoDovnTHn0jxhChPCAoABgAFAMMAoP2O/E3sNfQh3S/MPwSgAFAAMACmByC6L93xJ1I8IcoTggKA
          AUABwACYHoDovnTHn0jxhChPCAoABgAFAMMAoP2O/E3sNfQh3S/MPwSgAFAAMACmByC6L93xJ1I8
          IcoTggKAAUABwACYHoDovnTHn0jxhChPCAoABgAFAMMAoP2O/E3sNfQh3S/8ASm/Hw4hU36UAAAA
          AElFTkSuQmCC
          EOF
          base64 -d logo_base64.txt > custom_icon.png

      - name: Replace App Logo
        run: |
          # Find all launcher icons and replace them with the custom logo
          find ${{ env.PROJECT_DIR }}/src/main/res -name "ic_launcher*.png" -exec cp custom_icon.png {} \;

      - name: Build APK & Rename
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle assembleDebug
          find . -name "*.apk" -exec mv {} ./FitTrack.apk \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FitTrack
          path: '${{ env.PROJECT_DIR }}/FitTrack.apk'
