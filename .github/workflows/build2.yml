name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project Zip
        run: |
          unzip -o *.zip -d extracted_project
          
          # Find folder containing build.gradle
          PROJ_PATH=$(find extracted_project -name "build.gradle" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJ_PATH" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          
